<!DOCTYPE html>
<html>

<head>
    <title>Các Đội Bóng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <a href="{% url 'home' %}" class="btn btn-secondary mb-3">← Quay lại Trang chủ</a>
    <h2 class="text-primary border-bottom pb-2">⚽ Các Câu Lạc Bộ</h2>
    <div class="row mt-3">
        {% for team in teams %}
        <div class="col-md-3 mb-4">
            <div class="card h-100 shadow-sm text-center p-3">
                {% if team.logo %}
                <img src="{{ team.logo.url }}" class="img-fluid mx-auto" style="height: 100px; object-fit: contain;">
                {% else %}
                <div class="bg-light d-flex align-items-center justify-content-center mx-auto"
                    style="height:100px; width:100px; border-radius:50%">NO LOGO</div>
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ team.name }}</h5>
                    <p class="text-muted small mb-1"><i class="fas fa-map-marker-alt me-1"></i>{{ team.stadium }}</p>
                    <p class="text-muted small"><i class="fas fa-user-tie me-1"></i>HLV: <strong>{{
                            team.current_coach.name|default:"Chưa cập nhật" }}</strong></p>
                    <a href="{% url 'team_detail' team.id %}" class="btn btn-outline-primary btn-sm">Xem đội hình</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</body>

</html>
