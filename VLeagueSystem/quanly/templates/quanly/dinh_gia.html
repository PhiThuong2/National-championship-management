<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Định Giá Cầu Thủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="text-primary mb-4">🤖 Trợ lý AI Định Giá Cầu Thủ</h2>

    <div class="row">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <form method="POST">
                    {% csrf_token %} <div class="mb-3">
                        <label class="form-label">Tên cầu thủ</label>
                        <input type="text" name="name" class="form-control" required placeholder="VD: Nguyễn Quang Hải">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tuổi</label>
                        <input type="number" name="age" class="form-control" value="25">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vị trí</label>
                        <select name="position" class="form-select">
                            <option>Tiền đạo</option>
                            <option>Tiền vệ</option>
                            <option>Hậu vệ</option>
                            <option>Thủ môn</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Thành tích / Phong độ</label>
                        <textarea name="stats" class="form-control" rows="3" placeholder="VD: Ghi 10 bàn, tuyển thủ quốc gia"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">🔮 Định giá ngay</button>
                </form>
            </div>
        </div>

        <div class="col-md-7">
            {% if result %}
            <div class="alert alert-info">
                <h4>Kết quả phân tích:</h4>
                <p style="white-space: pre-line;">{{ result }}</p>
            </div>
            {% endif %}
            
            {% if error %}
            <div class="alert alert-danger">
                Lỗi: {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
