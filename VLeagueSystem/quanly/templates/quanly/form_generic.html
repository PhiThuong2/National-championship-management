<!DOCTYPE html>
<html>
<head><title>{{ title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="width: 600px;">
        <h3 class="text-center text-primary mb-4">{{ title }}</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-bold">{{ field.label }}</label>
                {{ field }} {% if field.errors %}
                    <div class="text-danger small">{{ field.errors.0 }}</div>
                {% endif %}
                <script>
                    document.getElementsByName("{{ field.name }}")[0].classList.add("form-control");
                    if ("{{ field.name }}" === "status" || "{{ field.name }}" === "position" || "{{ field.name }}" === "contract_type" || "{{ field.name }}" === "player") {
                        document.getElementsByName("{{ field.name }}")[0].classList.add("form-select");
                    }
                </script>
            </div>
            {% endfor %}
            
            <div class="d-flex gap-2 mt-4">
                <a href="{% url 'club_dashboard' %}" class="btn btn-secondary w-50">Hủy bỏ</a>
                <button type="submit" class="btn btn-success w-50">Lưu Dữ Liệu</button>
            </div>
        </form>
    </div>
</body>
</html>
