<!DOCTYPE html>
<html>
<head><title>Gửi Phản Hồi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container mt-4" style="max-width: 600px;">
    <a href="{% url 'home' %}" class="btn btn-secondary mb-3">← Quay lại</a>
    
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">📢 Gửi ý kiến cho Ban Tổ Chức</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input type="text" name="title" class="form-control" required placeholder="VD: Góp ý về sân bãi...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Nội dung</label>
                    <textarea name="content" class="form-control" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Đánh giá giải đấu</label>
                    <select name="rating" class="form-select">
                        <option value="5">⭐⭐⭐⭐⭐ (Tuyệt vời)</option>
                        <option value="4">⭐⭐⭐⭐ (Tốt)</option>
                        <option value="3">⭐⭐⭐ (Bình thường)</option>
                        <option value="2">⭐⭐ (Tệ)</option>
                        <option value="1">⭐ (Rất tệ)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Gửi Phản Hồi</button>
            </form>
        </div>
    </div>
</body>
</html>
